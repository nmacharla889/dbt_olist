version: 2

models:
  - name: stg_sales__order_reviews
    description: "One row per review per order (review_id + order_id). The source repeats some review_id values across several orders (one review left for a multi-order purchase), so review_id alone is not unique. Deduplicating on review_id alone silently dropped the review for hundreds of orders."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_id
            - order_id
    columns:
      - name: review_id
        data_type: string
        description: "Review identifier. Not unique on its own: the same review can cover several orders. Unique together with order_id."
        tests:
          - not_null

      - name: order_id
        data_type: string
        description: "Key to the orders dataset. Each review is associated with a unique order."
        tests:
          - not_null

      - name: review_score
        data_type: bigint
        description: "Score assigned by the customer for the order (e.g., 1 to 5)."
          
      - name: review_title
        data_type: string
        description: "Title or headline of the customer review in Portuguese."

      - name: review_message
        data_type: string
        description: "Detailed message or content of the customer review in Portuguese."

      - name: review_date
        data_type: date
        description: "Date when the review was submitted."

      - name: review_answer_date
        data_type: date
        description: "Date when the seller responded to the review."