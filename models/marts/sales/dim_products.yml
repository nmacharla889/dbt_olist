version: 2

models:
  - name: dim_products
    description: "One row per product (every product in the source, including products with no category or no English translation). Grain: product_id. Use product_category_name_english for reporting. Products with no category show as 'unknown'; categories with no translation fall back to the Portuguese name."
    columns:
      - name: product_key
        data_type: string
        description: "Surrogate primary key generated via dbt_utils.generate_surrogate_key"
        tests:
          - not_null
          - unique

      - name: product_id
        data_type: string
        description: "Unique identifier for each product"
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_sales__products')
              field: product_id

      - name: product_category_name
        data_type: string
        description: "Product category in Portuguese, as in the source. 'unknown' when the source has no category."
        tests:
          - not_null

      - name: product_category_name_english
        data_type: string
        description: "Product category in English, from the translation table. Falls back to the Portuguese name when there is no translation, and to 'unknown' when there is no category."
        tests:
          - not_null

      - name: product_name_length
        data_type: bigint
        description: "The length of the product name"

      - name: product_description_length
        data_type: bigint
        description: "The length of the product description"

      - name: product_photos_qty
        data_type: bigint
        description: "The quantity of photos associated with the product"

      - name: product_weight
        data_type: bigint
        description: "The weight of the product"

      - name: product_length
        data_type: bigint
        description: "The length of the product"

      - name: product_height
        data_type: bigint
        description: "The height of the product"

      - name: product_width
        data_type: bigint
        description: "The width of the product"
