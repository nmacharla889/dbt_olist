version: 2

models:
  - name: fct_order_items
    description: "Grain: one row per order line item (order_id + item_id). Holds the foreign keys to dim_products, dim_sellers, dim_customers and dim_date, plus item-level measures (item_price_in_brl, item_freight_value_in_brl, total_item_value_in_brl). Order-level columns (total_payment_value_in_brl, max_payment_installments, payment_method_count, paid_by_* flags, avg_review_score) are repeated on every item row of the same order. Never SUM them across items: that counts the order once per item. Use item_price_in_brl + item_freight_value_in_brl for revenue, and count distinct order_id for orders."
    columns:
      - name: order_item_key
        data_type: string
        description: "Surrogate primary key generated via dbt_utils.generate_surrogate_key hashed on order_id and item_id"
        tests:
          - unique
          - not_null

      - name: product_key
        data_type: string
        description: "Foreign key to dim_products"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key

      - name: seller_key
        data_type: string
        description: "Foreign key to dim_sellers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_key

      - name: customer_key
        data_type: string
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key

      - name: order_purchase_date_key
        data_type: int
        description: "Foreign key to dim_date based on order_purchase_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: order_id
        data_type: string
        description: "Unique identifier for each order, shared across all items in the same order."
        tests:
          - not_null
          - relationships:
              to: ref('stg_sales__orders')
              field: order_id

      - name: item_id
        data_type: bigint
        description: "Unique identifier for each item within an order. For example, if an order has three items, they will have item_id values of 1, 2, and 3."
        tests:
          - not_null
          - relationships:
              to: ref('stg_sales__order_items')
              field: item_id
              severity: warn

      - name: order_status
        data_type: string
        description: "The status of the order (e.g., shipped, delivered)."
        tests:
          - not_null

      - name: order_purchase_date
        data_type: date
        description: "The date when the order was purchased."
        tests:
          - not_null

      - name: order_approved_date
        data_type: date
        description: "The date when the order was approved."

      - name: order_delivered_carrier_date
        data_type: date
        description: "The date when the order was delivered by the carrier. This is the date when the order was handed over to the delivery service, not necessarily when it was delivered to the customer. This date can be used to analyze the efficiency of the delivery process and to calculate delivery times."

      - name: order_delivered_customer_date
        data_type: date
        description: "The date when the order was delivered to the customer."

      - name: order_estimated_delivery_date
        data_type: date
        description: "The date when the order is estimated to be delivered. This can be used to analyze the accuracy of delivery estimates and to calculate delivery delays."
        tests:
          - not_null

      - name: delivery_delay_days
        data_type: int
        description: "Days between the estimated delivery date and the actual delivery to the customer (delivered minus estimated). Positive = late, zero or negative = on time or early. Null until the order is delivered."

      - name: item_price_in_brl
        data_type: double
        description: "The price of the item in Brazilian Real (BRL). This is the amount paid by the customer for this specific item, excluding any discounts or promotions."
        tests:
          - not_null

      - name: item_freight_value_in_brl
        data_type: double
        description: "The freight value of the item in Brazilian Real (BRL). This is the cost associated with shipping the item to the customer."
        tests:
          - not_null
        
      - name: total_item_value_in_brl
        data_type: double
        description: "The total value of the item in Brazilian Real (BRL), including price and freight."
        tests:
          - not_null

      - name: total_payment_value_in_brl
        data_type: double
        description: "Order-level: total payment for the whole order in BRL, repeated on every item row of that order. Do not SUM across items. 0 when the order has no payment record."
        tests:
          - not_null

      - name: max_payment_installments
        data_type: bigint
        description: "Order-level (repeated on every item row of the order): the maximum number of payment installments used on the order."

      - name: payment_method_count
        data_type: bigint
        description: "Order-level (repeated on every item row of the order): the number of different payment methods used."

      - name: paid_by_credit_card
        data_type: int
        description: "Indicator of whether the order was paid by credit card (1) or not (0)."

      - name: paid_by_boleto
        data_type: int
        description: "Indicator of whether the order was paid by boleto (1) or not (0)."

      - name: paid_by_voucher
        data_type: int
        description: "Indicator of whether the order was paid by voucher (1) or not (0)."

      - name: paid_by_debit_card
        data_type: int
        description: "Indicator of whether the order was paid by debit card (1) or not (0)."

      - name: avg_review_score
        data_type: double
        description: "Order-level (repeated on every item row of the order): average review score for the whole order, not for the item. Averaging this column directly weights orders by their number of items; to average per order, take one value per order_id first."