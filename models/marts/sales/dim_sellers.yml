version: 2

models:
  - name: dim_sellers
    description: "The table contains information about sellers within the Olist platform. This data can be used to analyze seller distributions, assess regional performance, and support geolocation-based marketing strategies."
    columns:
      - name: seller_key
        data_type: string
        description: "Surrogate primary key generated via dbt_utils.generate_surrogate_key"
        tests:
          - unique
          - not_null

      - name: seller_id
        data_type: string
        description: "Unique identifier for each seller within the Olist platform."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_sales__sellers')
              field: seller_id

      - name: zip_code
        data_type: bigint
        description: "The postal code of the seller's location."

      - name: seller_city
        data_type: string
        description: "City from the geolocation table for the seller's zip code. 'unknown' when the zip code is not in the geolocation table."
        tests:
          - not_null

      - name: seller_state
        data_type: string
        description: "State from the geolocation table for the seller's zip code. 'unknown' when the zip code is not in the geolocation table."
        tests:
          - not_null