version: 2

models:
  - name: dim_date
    description: "One row per calendar day from 2016-01-01 to 2018-12-31 (the end date in the model is exclusive). Shared by both facts: fct_order_items uses it once (purchase date); fct_marketing_funnel uses it twice (lead date and deal close date)."
    columns:
      - name: date_day
        data_type: date
        description: "The actual date value"
        tests:
          - not_null
          - unique

      - name: date_key
        data_type: int
        description: "Surrogate key for the date, in yyyyMMdd form (for example 20180131). Primary key; the facts join on this."
        tests:
          - not_null
          - unique

      - name: year
        data_type: int
        description: "The year component of the date"

      - name: month_num
        data_type: int
        description: "The month component of the date"

      - name: month_name
        data_type: string
        description: "The name of the month"

      - name: month_short
        data_type: string
        description: "The short name of the month"

      - name: quarter_num
        data_type: int
        description: "The quarter component of the date"

      - name: quarter_label
        data_type: string
        description: "The label for the quarter"

      - name: day_of_week
        data_type: int
        description: "Day of the week from Spark SQL dayofweek(): 1 = Sunday, 2 = Monday, ... 7 = Saturday"

      - name: day_name
        data_type: string
        description: "The name of the day of the week"

      - name: day_short
        data_type: string
        description: "The short name of the day of the week"

      - name: day_of_month
        data_type: int
        description: "The day of the month component of the date"

      - name: day_of_year
        data_type: int
        description: "The day of the year component of the date"

      - name: week_of_year
        data_type: int
        description: "The week of the year component of the date"

      - name: is_weekend
        data_type: boolean
        description: "True for Saturday and Sunday, false otherwise"

      - name: year_month
        data_type: string
        description: "The year and month component of the date in the format 'YYYY-MM'"

      - name: month_start
        data_type: date
        description: "First day of the month. Use it as the x-axis of monthly trend charts (continuous axis, sorts correctly)."
        tests:
          - not_null

      - name: is_full_data_month
        data_type: boolean
        description: "True for Jan 2017 to Aug 2018, the months where Olist order data is complete (dates set by the full_data_start and full_data_end vars). Filter monthly trend charts on true so the near-empty months at both ends don't look like crashes."
        tests:
          - not_null
